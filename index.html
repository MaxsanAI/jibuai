<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Jibu AI – Free Smart AI Assistant, Chat & Image Generator</title>
    <link rel="canonical" href="https://jibuai.toolsnestt.com/">

    <!-- Monetag Skripta -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="264917" async data-cfasync="false"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .chat-container::-webkit-scrollbar { width: 5px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center font-bold text-sm text-white shadow">
                J
            </div>
            <div>
                <h1 class="font-bold text-sm leading-tight">Jibu AI</h1>
                <p class="text-[10px] text-emerald-400 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online
                </p>
            </div>
        </div>
        <button onclick="clearHistory()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 transition">
            Clear 🗑️
        </button>
    </header>

    <!-- Chat Message Area (Fiksiran scroll i visina) -->
    <main id="chatWindow" class="chat-container flex-1 overflow-y-auto p-3 space-y-3 max-w-2xl w-full mx-auto">
        <!-- Poruke se ucitavaju ovde -->
    </main>

    <!-- Mali diskretni CTA Baner -->
    <div class="max-w-2xl w-full mx-auto px-3 py-1 shrink-0">
        <a href="https://omg10.com/4/9027972" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-indigo-950/40 hover:bg-indigo-950/70 border border-indigo-500/30 rounded-lg px-3 py-1.5 transition text-xs">
            <span class="text-slate-300 flex items-center gap-1.5 truncate">
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping shrink-0"></span>
                <span>🔥 <strong class="text-indigo-300">Sponsored Tool:</strong> Discover exclusive offers</span>
            </span>
            <span class="text-indigo-400 font-semibold shrink-0 ml-2">Open &rarr;</span>
        </a>
    </div>

    <!-- Quick Prompts & Image Counter -->
    <div class="max-w-2xl w-full mx-auto px-3 pb-1.5 shrink-0 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
        <div class="flex gap-1.5 shrink-0">
            <button onclick="sendQuickPrompt('Write a professional CV summary')" class="text-[11px] bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-2.5 py-1 rounded-full whitespace-nowrap transition">📝 CV</button>
            <button onclick="sendQuickPrompt('Explain how small business works')" class="text-[11px] bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-2.5 py-1 rounded-full whitespace-nowrap transition">💡 Business</button>
            <button onclick="triggerImagePrompt()" class="text-[11px] bg-violet-600/30 hover:bg-violet-600/50 border border-violet-500/50 text-violet-300 px-2.5 py-1 rounded-full whitespace-nowrap transition">🎨 Image</button>
        </div>
        <span id="imageCounterBadge" class="text-[10px] text-slate-400 bg-slate-900 px-2 py-0.5 rounded-full border border-slate-800 shrink-0">5/5 left</span>
    </div>

    <!-- Input Bar -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2.5 shrink-0">
        <form id="chatForm" onsubmit="handleFormSubmit(event)" class="max-w-2xl mx-auto flex items-center gap-2 w-full">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type message or image prompt..." 
                autocomplete="off"
                required
                class="min-w-0 flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs sm:text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 transition"
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-xs sm:text-sm transition shrink-0 shadow">
                Send
            </button>
        </form>
    </footer>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageCounterBadge = document.getElementById('imageCounterBadge');

        let messageHistory = JSON.parse(localStorage.getItem('jibu_chat_history')) || [];

        window.addEventListener('DOMContentLoaded', () => {
            updateImageLimitUI();
            if (messageHistory.length === 0) {
                appendMessage("Hello! I am Jibu AI. Chat with me or use the button above to generate free AI images daily!", 'ai', false);
            } else {
                messageHistory.forEach(msg => appendMessage(msg.content, msg.role === 'user' ? 'user' : 'ai', false));
            }
        });

        function checkDailyImageLimit() {
            const today = new Date().toDateString();
            let usageData = JSON.parse(localStorage.getItem('jibu_image_usage')) || { date: today, count: 0 };
            if (usageData.date !== today) usageData = { date: today, count: 0 };
            return usageData.count < 5;
        }

        function incrementImageUsage() {
            const today = new Date().toDateString();
            let usageData = JSON.parse(localStorage.getItem('jibu_image_usage')) || { date: today, count: 0 };
            if (usageData.date !== today) usageData = { date: today, count: 0 };
            usageData.count += 1;
            localStorage.setItem('jibu_image_usage', JSON.stringify(usageData));
            updateImageLimitUI();
        }

        function updateImageLimitUI() {
            const today = new Date().toDateString();
            let usageData = JSON.parse(localStorage.getItem('jibu_image_usage')) || { date: today, count: 0 };
            if (usageData.date !== today) usageData.count = 0;
            imageCounterBadge.innerText = `${5 - usageData.count}/5 left`;
        }

        function sendQuickPrompt(text) {
            userInput.value = text;
            processMessage(text, 'chat');
        }

        function triggerImagePrompt() {
            const text = userInput.value.trim();
            if (!text) {
                alert("Type what kind of image you want in the input box first!");
                return;
            }
            if (!checkDailyImageLimit()) {
                alert("You reached your daily limit of 5 free AI images.");
                return;
            }
            incrementImageUsage();
            processMessage(text, 'image');
            userInput.value = '';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            processMessage(text, 'chat');
        }

        async function processMessage(text, mode) {
            appendMessage(text, 'user', true);
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loadingId = appendLoading(mode === 'image' ? 'Generating image...' : 'Thinking...');

            try {
                if (mode === 'image') {
                    const response = await fetch('/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'image', prompt: text })
                    });
                    removeLoading(loadingId);
                    if (response.ok) {
                        const blob = await response.blob();
                        appendImageMessage(URL.createObjectURL(blob), text);
                    } else {
                        appendMessage("Image generation failed.", 'ai', false);
                    }
                } else {
                    const response = await fetch('/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'chat', messages: messageHistory })
                    });
                    const data = await response.json();
                    removeLoading(loadingId);
                    if (data.success && data.result && data.result.response) {
                        appendMessage(data.result.response, 'ai', true);
                    } else {
                        appendMessage("Error occurred. Try again.", 'ai', false);
                    }
                }
            } catch (err) {
                removeLoading(loadingId);
                appendMessage("Network error.", 'ai', false);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender, saveToStorage) {
            const isUser = sender === 'user';
            const html = `
                <div class="flex items-start space-x-2.5 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="w-7 h-7 rounded-lg ${isUser ? 'bg-violet-600' : 'bg-indigo-600'} flex items-center justify-center shrink-0 text-xs font-bold text-white shadow">
                        ${isUser ? 'U' : 'AI'}
                    </div>
                    <div class="${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'} rounded-xl p-3 text-xs sm:text-sm max-w-[85%] leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            if (saveToStorage) {
                messageHistory.push({ role: isUser ? 'user' : 'assistant', content: text });
                localStorage.setItem('jibu_chat_history', JSON.stringify(messageHistory));
            }
        }

        function appendImageMessage(url, promptText) {
            const html = `
                <div class="flex items-start space-x-2.5">
                    <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0 text-xs font-bold text-white">AI</div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl rounded-tl-none p-2.5 max-w-[85%] shadow-sm space-y-1.5">
                        <p class="text-[11px] text-slate-400">"${escapeHtml(promptText)}"</p>
                        <div class="relative inline-block w-full overflow-hidden rounded-lg border border-slate-800">
                            <img src="${url}" alt="AI" class="w-full object-cover max-h-60 block">
                            <div class="absolute bottom-1.5 right-1.5 bg-black/60 px-1.5 py-0.5 rounded text-[9px] text-white/90">JibuAI</div>
                        </div>
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearHistory() {
            localStorage.removeItem('jibu_chat_history');
            messageHistory = [];
            chatWindow.innerHTML = '';
            appendMessage("Chat cleared. How can I help you?", 'ai', false);
        }

        function appendLoading(text) {
            const id = 'loading-' + Date.now();
            const html = `
                <div id="${id}" class="flex items-start space-x-2.5">
                    <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0 text-xs font-bold text-white">AI</div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl rounded-tl-none p-3 text-xs text-slate-300 flex items-center space-x-2">
                        <span class="w-1.5 h-1.5 bg-indigo-400 rounded-full animate-bounce"></span>
                        <span>${text}</span>
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
