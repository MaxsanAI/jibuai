<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Jibu AI – Assistant</title>
    <link rel="canonical" href="https://jibuai.toolsnestt.com/">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Google Sans', sans-serif, system-ui;
            background-color: #131314;
            color: #e3e3e3;
        }

        /* Fluidan Gemini skrol */
        .chat-scroll {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #444746; border-radius: 10px; }
        
        input { font-size: 16px !important; }

        /* Gemini gradient animacija za logo */
        .gemini-gradient {
            background: linear-gradient(135deg, #9bb7df, #d0bcff, #f8bbd0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex flex-col justify-between">

    <!-- Gemini Header -->
    <header class="bg-[#131314] px-4 py-3 flex items-center justify-between shrink-0 z-20 border-b border-[#282a2c]">
        <div class="flex items-center space-x-3">
            <div class="w-7 h-7 flex items-center justify-center">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24Z" fill="url(#paint0_linear)"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#99c3ff"/>
                            <stop offset="0.5" stop-color="#c4b5fd"/>
                            <stop offset="1" stop-color="#fbcfe8"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="font-medium text-base tracking-wide gemini-gradient">Jibu AI</h1>
        </div>
        <button onclick="clearHistory()" class="text-xs text-[#c4c7c5] bg-[#1e1f22] hover:bg-[#282a2c] px-3 py-1.5 rounded-full transition">
            New chat ＋
        </button>
    </header>

    <!-- Chat Message Area -->
    <main id="chatWindow" class="chat-scroll flex-1 p-4 space-y-6 max-w-2xl w-full mx-auto">
        <!-- Poruke se ucitavaju ovde -->
    </main>

    <!-- Quick Prompts (Gemini Chips) -->
    <div class="max-w-2xl w-full mx-auto px-4 py-2 shrink-0 flex gap-2 overflow-x-auto no-scrollbar z-10">
        <button onclick="sendQuickPrompt('Write a professional CV summary')" class="text-xs bg-[#1e1f22] hover:bg-[#282a2c] text-[#e3e3e3] border border-[#3c4043] px-3.5 py-1.5 rounded-xl whitespace-nowrap transition">📝 CV Summary</button>
        <button onclick="sendQuickPrompt('Explain how small business works')" class="text-xs bg-[#1e1f22] hover:bg-[#282a2c] text-[#e3e3e3] border border-[#3c4043] px-3.5 py-1.5 rounded-xl whitespace-nowrap transition">💡 Business Tip</button>
        <button onclick="triggerImagePrompt()" class="text-xs bg-[#1e1f22] hover:bg-[#282a2c] text-[#d0bcff] border border-[#4f378b] px-3.5 py-1.5 rounded-xl whitespace-nowrap transition">🎨 Generate Image</button>
    </div>

    <!-- Gemini Input Bar -->
    <footer class="bg-[#131314] p-3 shrink-0 z-20">
        <form id="chatForm" onsubmit="handleFormSubmit(event)" class="max-w-2xl mx-auto bg-[#1e1f22] border border-[#3c4043] focus-within:border-[#8ab4f8] rounded-3xl px-4 py-2.5 flex items-center gap-3 transition">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Enter a prompt here..." 
                autocomplete="off"
                required
                class="min-w-0 flex-1 bg-transparent text-[#e3e3e3] placeholder-[#8e918f] text-sm focus:outline-none"
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="w-9 h-9 bg-[#8ab4f8] hover:bg-[#aecbfa] text-[#131314] rounded-full flex items-center justify-center transition shrink-0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
                </svg>
            </button>
        </form>
    </footer>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let messageHistory = JSON.parse(localStorage.getItem('jibu_gemini_history')) || [];

        window.addEventListener('DOMContentLoaded', () => {
            userInput.value = '';
            chatWindow.innerHTML = '';
            if (messageHistory.length === 0) {
                appendMessage("Hello! I'm your Jibu AI assistant. How can I help you today?", 'ai', false);
            } else {
                messageHistory.forEach(msg => {
                    const sender = msg.role === 'user' ? 'user' : 'ai';
                    if (msg.type === 'image') {
                        appendImageMessage(msg.url, msg.content, false);
                    } else {
                        appendMessage(msg.content, sender, false);
                    }
                });
            }
        });

        function sendQuickPrompt(text) {
            userInput.value = text;
            processMessage(text, 'chat');
        }

        function triggerImagePrompt() {
            const text = userInput.value.trim();
            if (!text) {
                alert("Type what kind of image you want in the input box first!");
                return;
            }
            processMessage(text, 'image');
            userInput.value = '';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            processMessage(text, 'chat');
        }

        async function processMessage(text, mode) {
            appendMessage(text, 'user', true);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loadingId = appendLoading(mode === 'image' ? 'Generating image...' : 'Thinking...');

            try {
                const response = await fetch('/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mode === 'image' ? { type: 'image', prompt: text } : { type: 'chat', messages: messageHistory })
                });

                removeLoading(loadingId);

                if (!response.ok) throw new Error("Server error");

                if (mode === 'image') {
                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    appendImageMessage(imageUrl, text, true);
                } else {
                    const data = await response.json();
                    if (data.success && data.result && data.result.response) {
                        appendMessage(data.result.response, 'ai', true);
                    } else if (typeof data.response === 'string') {
                        appendMessage(data.response, 'ai', true);
                    } else {
                        appendMessage("Error occurred. Try again.", 'ai', false);
                    }
                }
            } catch (err) {
                removeLoading(loadingId);
                appendMessage("Network or server error. Please try again.", 'ai', false);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.value = '';
                userInput.focus();
            }
        }

        function appendMessage(text, sender, saveToStorage) {
            const isUser = sender === 'user';
            const html = isUser ? `
                <div class="flex justify-end">
                    <div class="bg-[#2b2c2f] text-[#e3e3e3] rounded-3xl px-4 py-3 text-sm max-w-[85%] leading-relaxed">
                        ${escapeHtml(text)}
                    </div>
                </div>
            ` : `
                <div class="flex items-start space-x-3">
                    <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24Z" fill="url(#paint_ai)"/>
                            <defs>
                                <linearGradient id="paint_ai" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#99c3ff"/>
                                    <stop offset="0.5" stop-color="#c4b5fd"/>
                                    <stop offset="1" stop-color="#fbcfe8"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="text-[#e3e3e3] text-sm max-w-[85%] leading-relaxed pt-0.5">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            scrollToBottom();

            if (saveToStorage) {
                messageHistory.push({ role: isUser ? 'user' : 'assistant', content: text, type: 'chat' });
                localStorage.setItem('jibu_gemini_history', JSON.stringify(messageHistory));
            }
        }

        function appendImageMessage(url, promptText, saveToStorage) {
            const html = `
                <div class="flex items-start space-x-3">
                    <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24Z" fill="url(#paint_ai_img)"/>
                            <defs>
                                <linearGradient id="paint_ai_img" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#99c3ff"/>
                                    <stop offset="0.5" stop-color="#c4b5fd"/>
                                    <stop offset="1" stop-color="#fbcfe8"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="space-y-2 max-w-[85%]">
                        <p class="text-xs text-[#8e918f]">"${escapeHtml(promptText)}"</p>
                        <div class="overflow-hidden rounded-2xl border border-[#3c4043]">
                            <img src="${url}" alt="AI Generated Image" class="w-full object-cover max-h-64 block">
                        </div>
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            scrollToBottom();

            if (saveToStorage) {
                messageHistory.push({ role: 'assistant', content: promptText, type: 'image', url: url });
                localStorage.setItem('jibu_gemini_history', JSON.stringify(messageHistory));
            }
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }, 50);
        }

        function clearHistory() {
            localStorage.removeItem('jibu_gemini_history');
            messageHistory = [];
            chatWindow.innerHTML = '';
            userInput.value = '';
            appendMessage("Chat cleared. How can I help you today?", 'ai', false);
        }

        function appendLoading(text) {
            const id = 'loading-' + Date.now();
            const html = `
                <div id="${id}" class="flex items-start space-x-3">
                    <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24Z" fill="url(#paint_load)"/>
                            <defs>
                                <linearGradient id="paint_load" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#99c3ff"/>
                                    <stop offset="0.5" stop-color="#c4b5fd"/>
                                    <stop offset="1" stop-color="#fbcfe8"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="text-sm text-[#8e918f] flex items-center space-x-2 pt-0.5">
                        <span class="w-1.5 h-1.5 bg-[#8ab4f8] rounded-full animate-bounce"></span>
                        <span>${text}</span>
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
