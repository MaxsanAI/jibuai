<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Jibu AI – Free Smart AI Assistant, Chat & Image Generator</title>
    <meta name="title" content="Jibu AI – Free Smart AI Assistant, Chat & Image Generator">
    <meta name="description" content="Meet Jibu AI, your lightning-fast, mobile-friendly AI assistant. Ask questions, generate AI images, and get instant answers completely free.">
    <link rel="canonical" href="https://jibuai.toolsnestt.com/">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-dvh flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 p-4 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/20 text-white">
                J
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight tracking-wide">Jibu AI Studio</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Chat & Image Ready
                </p>
            </div>
        </div>
        <button onclick="clearHistory()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700/50 transition">
            Clear 🗑️
        </button>
    </header>

    <!-- Chat Message Area -->
    <main id="chatWindow" class="chat-container flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <!-- Poruke -->
    </main>

    <!-- Monetag oglasni prostor -->
    <div class="max-w-2xl w-full mx-auto px-4 py-1 shrink-0">
        <div class="bg-slate-900/40 border border-slate-800/50 rounded-xl p-2 text-center text-xs text-slate-500">
            <!-- UBACITE VAŠ MONETAG KOD OVDE -->
            <span class="opacity-60">Sponsored Ad Space</span>
        </div>
    </div>

    <!-- Quick Prompts & Image Generator Trigger -->
    <div class="max-w-2xl w-full mx-auto px-4 pb-2 flex gap-2 overflow-x-auto no-scrollbar shrink-0 items-center justify-between">
        <div class="flex gap-2 overflow-x-auto">
            <button onclick="sendQuickPrompt('Write a professional CV summary')" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap transition">📝 Write CV</button>
            <button onclick="sendQuickPrompt('Explain how small business works')" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-full whitespace-nowrap transition">💡 Start Business</button>
            <button onclick="triggerImagePrompt()" class="text-xs bg-violet-600/30 hover:bg-violet-600/50 border border-violet-500/50 text-violet-300 px-3 py-1.5 rounded-full whitespace-nowrap transition">🎨 Generate Image</button>
        </div>
        <span id="imageCounterBadge" class="text-[11px] text-slate-400 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-800 shrink-0">Images: 5/5 left</span>
    </div>

    <!-- Input Bar -->
    <footer class="bg-slate-900/80 backdrop-blur-md border-t border-slate-800/80 p-3 shrink-0">
        <form id="chatForm" onsubmit="handleFormSubmit(event)" class="max-w-2xl mx-auto flex items-center gap-2">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type message or image prompt..." 
                autocomplete="off"
                required
                class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 transition"
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-medium text-sm transition flex items-center justify-center shrink-0 shadow-lg shadow-indigo-600/20">
                Send
            </button>
        </form>
    </footer>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageCounterBadge = document.getElementById('imageCounterBadge');

        let messageHistory = JSON.parse(localStorage.getItem('jibu_chat_history')) || [];

        window.addEventListener('DOMContentLoaded', () => {
            updateImageLimitUI();
            if (messageHistory.length === 0) {
                appendMessage("Hello! I am Jibu AI. You can chat with me or use the button above to generate up to 5 free AI images daily!", 'ai', false);
            } else {
                messageHistory.forEach(msg => appendMessage(msg.content, msg.role === 'user' ? 'user' : 'ai', false));
            }
        });

        function checkDailyImageLimit() {
            const today = new Date().toDateString();
            let usageData = JSON.parse(localStorage.getItem('jibu_image_usage')) || { date: today, count: 0 };

            if (usageData.date !== today) {
                usageData = { date: today, count: 0 };
            }

            if (usageData.count >= 5) {
                return false; // Dostignut limit
            }
            return true;
        }

        function incrementImageUsage() {
            const today = new Date().toDateString();
            let usageData = JSON.parse(localStorage.getItem('jibu_image_usage')) || { date: today, count: 0 };
            if (usageData.date !== today) {
                usageData = { date: today, count: 0 };
            }
            usageData.count += 1;
            localStorage.setItem('jibu_image_usage', JSON.stringify(usageData));
            updateImageLimitUI();
        }

        function updateImageLimitUI() {
            const today = new Date().toDateString();
            let usageData = JSON.parse(localStorage.getItem('jibu_image_usage')) || { date: today, count: 0 };
            if (usageData.date !== today) usageData.count = 0;
            const remaining = 5 - usageData.count;
            imageCounterBadge.innerText = `Images: ${remaining}/5 left`;
        }

        function sendQuickPrompt(text) {
            userInput.value = text;
            processMessage(text, 'chat');
        }

        function triggerImagePrompt() {
            const text = userInput.value.trim();
            if (!text) {
                alert("Please type what kind of image you want in the input box first (e.g. 'A futuristic city')!");
                return;
            }
            
            if (!checkDailyImageLimit()) {
                alert("You have reached your daily limit of 5 free AI images. Please come back tomorrow!");
                return;
            }

            incrementImageUsage();
            processMessage(text, 'image');
            userInput.value = '';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            processMessage(text, 'chat');
        }

        async function processMessage(text, mode) {
            appendMessage(text, 'user', true);
            userInput.disabled = true;
            sendBtn.disabled = true;

            const loadingId = appendLoading(mode === 'image' ? 'Generating AI Image (takes a few seconds)...' : 'AI is thinking...');

            try {
                if (mode === 'image') {
                    const response = await fetch('/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'image', prompt: text })
                    });

                    removeLoading(loadingId);

                    if (response.ok) {
                        const blob = await response.blob();
                        const imageUrl = URL.createObjectURL(blob);
                        appendImageMessage(imageUrl, text);
                    } else {
                        appendMessage("Sorry, image generation failed. Try a different prompt.", 'ai', false);
                    }
                } else {
                    const response = await fetch('/ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: 'chat', messages: messageHistory })
                    });

                    const data = await response.json();
                    removeLoading(loadingId);

                    if (data.success && data.result && data.result.response) {
                        const aiReply = data.result.response;
                        appendMessage(aiReply, 'ai', true);
                    } else {
                        appendMessage("Sorry, I encountered an error. Please try again.", 'ai', false);
                    }
                }
            } catch (err) {
                removeLoading(loadingId);
                appendMessage("Network error. Please check your connection.", 'ai', false);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender, saveToStorage) {
            const isUser = sender === 'user';
            const html = `
                <div class="flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="w-8 h-8 rounded-lg ${isUser ? 'bg-violet-600' : 'bg-indigo-600'} flex items-center justify-center shrink-0 text-sm font-bold text-white shadow">
                        ${isUser ? 'U' : 'AI'}
                    </div>
                    <div class="${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'} rounded-2xl p-3.5 text-sm max-w-[85%] leading-relaxed shadow-sm">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            if (saveToStorage) {
                messageHistory.push({ role: isUser ? 'user' : 'assistant', content: text });
                localStorage.setItem('jibu_chat_history', JSON.stringify(messageHistory));
            }
        }

        function appendImageMessage(url, promptText) {
            const html = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0 text-sm font-bold text-white">AI</div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none p-3 max-w-[85%] shadow-sm space-y-2">
                        <p class="text-xs text-slate-400">Generated for: "${escapeHtml(promptText)}"</p>
                        <!-- Kontejner sa slikom i vodenim žigom dole desno -->
                        <div class="relative inline-block w-full overflow-hidden rounded-xl border border-slate-800">
                            <img src="${url}" alt="AI Generated" class="w-full object-cover max-h-72 block">
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-md px-2 py-1 rounded text-[10px] font-medium text-white/90 border border-white/10 tracking-wide pointer-events-none shadow">
                                Made with JibuAI
                            </div>
                        </div>
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearHistory() {
            localStorage.removeItem('jibu_chat_history');
            messageHistory = [];
            chatWindow.innerHTML = '';
            appendMessage("Chat history cleared. How can I help you today?", 'ai', false);
        }

        function appendLoading(text) {
            const id = 'loading-' + Date.now();
            const html = `
                <div id="${id}" class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0 text-sm font-bold text-white">AI</div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl rounded-tl-none p-3.5 text-sm text-slate-300 flex items-center space-x-2">
                        <span class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></span>
                        <span>${text}</span>
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
